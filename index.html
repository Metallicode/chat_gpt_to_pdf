<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Pro Exporter v6 (Native Text & RTL)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/github-dark.min.css">
    
    <style>
        :root { --primary: #10a37f; --bg: #f7f7f8; }
        body { font-family: -apple-system, system-ui, sans-serif; margin: 0; background: var(--bg); display: flex; flex-direction: column; height: 100vh; }
        
        /* UI Elements - Hidden during Print */
        .toolbar { background: white; padding: 12px 24px; display: flex; gap: 12px; align-items: center; border-bottom: 1px solid #e5e5e5; z-index: 100; }
        .main-content { display: flex; flex-grow: 1; overflow: hidden; }
        .pane { width: 50%; display: flex; flex-direction: column; }
        textarea { flex-grow: 1; padding: 20px; border: none; font-family: monospace; font-size: 14px; background: #fafafa; outline: none; border-right: 1px solid #eee; }
        
        /* Preview Area */
        .preview-pane { background: white; overflow-y: auto; }
        #render-area { 
            padding: 40px; 
            line-height: 1.6; 
            font-size: 15px; 
            color: #24292f;
            min-height: 100%;
        }

        /* RTL Handling */
        .rtl-block { direction: rtl; text-align: right; font-family: 'Arial', sans-serif; }
        .ltr-block { direction: ltr; text-align: left; }

        /* Code Blocks - Always LTR */
        pre { background: #1e1e1e; padding: 15px; border-radius: 8px; direction: ltr !important; text-align: left !important; overflow-x: auto; }
        code { font-family: monospace; }
        p code { background: #f0f0f0; padding: 2px 4px; border-radius: 4px; }

        /* Print Specifics */
        @media print {
            .toolbar, textarea { display: none !important; }
            .main-content, .pane, .preview-pane { display: block !important; width: 100% !important; height: auto !important; overflow: visible !important; }
            body { background: white; }
            #render-area { padding: 0; margin: 0; }
            pre { white-space: pre-wrap; word-wrap: break-word; }
        }

        /* Buttons */
        button, .btn-support { padding: 10px 16px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; text-decoration: none; font-size: 13px; display: flex; align-items: center; gap: 6px; }
        .btn-paste { background: #6e6e73; color: white; }
        .btn-print { background: var(--primary); color: white; }
        .btn-support { background: #FFDD00; color: black; }
    </style>
</head>
<body>

<div class="toolbar">
    <strong>AI PDF PRO</strong>
    <button class="btn-paste" onclick="pasteFromClipboard()">📋 Paste</button>
    <div style="flex-grow:1"></div>
    <a href="https://buymeacoffee.com/metallicode?new=1" target="_blank" class="btn-support">☕ Support</a>
    <button class="btn-print" onclick="generatePDF()">🖨️ Save as PDF</button>
</div>

<div class="main-content">
    <div class="pane">
        <textarea id="rawInput" placeholder="Paste Hebrew/English mixed text..." oninput="updatePreview()"></textarea>
    </div>
    <div class="pane preview-pane">
        <div id="render-area"></div>
    </div>
</div>

<script>
    function updatePreview() {
        const input = document.getElementById('rawInput').value;
        const renderArea = document.getElementById('render-area');
        
        // Custom Markdown parsing for RTL detection
        const rawHtml = marked.parse(input);
        renderArea.innerHTML = rawHtml;

        // Apply RTL logic to paragraphs containing Hebrew
        const paragraphs = renderArea.querySelectorAll('p, li, h1, h2, h3');
        const hebrewPattern = /[\u0590-\u05FF]/;
        
        paragraphs.forEach(el => {
            if (hebrewPattern.test(el.innerText)) {
                el.classList.add('rtl-block');
            } else {
                el.classList.add('ltr-block');
            }
        });

        // Highlight code
        renderArea.querySelectorAll('pre code').forEach((el) => {
            hljs.highlightElement(el);
            el.parentElement.classList.add('ltr-block'); // Codes are always LTR
        });
    }

    async function pasteFromClipboard() {
        try {
            const text = await navigator.clipboard.readText();
            document.getElementById('rawInput').value = text;
            updatePreview();
        } catch (e) { alert("Please use Ctrl+V"); }
    }

    function generatePDF() {
        // This opens the browser's native print dialog.
        // Users should select "Save as PDF" as the destination.
        window.print();
    }
</script>
</body>
</html>
